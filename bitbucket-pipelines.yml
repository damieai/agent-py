image: python:3.12-slim
pipelines:
  custom:
    investigation-experiment:
      - step:
          name: Paired investigation Harness experiment and durable resume
          max-time: 10
          script:
            - pip install uv==0.12.17
            - uv sync --extra dev --frozen
            - .venv/bin/agent-py experiment-freeze examples/investigation-experiment.json .runtime/investigation-experiments/dataset.json
            - .venv/bin/agent-py investigation-experiment .runtime/investigation-experiments/dataset.json examples/investigation-experiment-config.json .runtime/investigation-experiments/development
            - .venv/bin/agent-py investigation-experiment .runtime/investigation-experiments/dataset.json examples/investigation-experiment-config.json .runtime/investigation-experiments/development --resume
          artifacts:
            - .runtime/investigation-experiments/**
    retrieval-experiment:
      - step:
          name: Frozen retrieval experiment, resume and independent audit
          max-time: 10
          script:
            - pip install uv==0.12.17
            - uv sync --extra dev --frozen
            - .venv/bin/agent-py experiment-freeze examples/retrieval-experiment.json .runtime/experiments/dataset.json
            - .venv/bin/agent-py experiment-run .runtime/experiments/dataset.json .runtime/experiments/development --repeats 2
            - .venv/bin/agent-py experiment-run .runtime/experiments/dataset.json .runtime/experiments/development --repeats 2 --resume
            - .venv/bin/agent-py experiment-audit .runtime/experiments/development .runtime/experiments/development-audit.json
          artifacts:
            - .runtime/experiments/**
    langfuse-trajectory-rehearsal:
      - step:
          name: Three-workflow Langfuse local trajectory rehearsal
          max-time: 10
          script:
            - pip install uv==0.12.17
            - uv sync --extra dev --extra langfuse --frozen
            - .venv/bin/python scripts/check_langfuse_trajectories.py
          artifacts:
            - .runtime/langfuse-trajectories/**
    langfuse-local-probe:
      - step:
          name: Langfuse loopback export fault and overhead probe
          max-time: 10
          script:
            - pip install uv==0.12.17
            - uv sync --extra dev --extra langfuse --frozen
            - .venv/bin/python scripts/check_langfuse.py
          artifacts:
            - .runtime/langfuse/**
    recovery-drill:
      - step:
          name: Native worker process recovery drill
          max-time: 10
          script:
            - pip install uv==0.12.17
            - uv sync --extra dev --frozen
            - .venv/bin/python scripts/check_recovery.py
          artifacts:
            - .runtime/recovery/**
  default:
    - step:
        name: Python contract and fault tests
        script:
          - pip install uv==0.12.17
          - uv sync --extra dev --extra langfuse --frozen
          - .venv/bin/ruff check .
          - .venv/bin/ruff format --check .
          - .venv/bin/python scripts/langfuse_stack.py check
          - mkdir -p .runtime
          - AGENT_DATABASE_URL=sqlite:///.runtime/ci-migrations.db .venv/bin/alembic upgrade head
          - AGENT_DATABASE_URL=sqlite:///.runtime/ci-migrations.db .venv/bin/alembic check
          - .venv/bin/pytest -q --junitxml=.runtime/tests.xml
          - .venv/bin/python scripts/check_evaluation_gate.py
          - AGENT_CONTEXT_STRATEGY=bm25_rrf .venv/bin/agent-py release-build .runtime/gate/release.json
        artifacts:
          - .runtime/tests.xml
          - .runtime/gate/*.json
    - step:
        name: Workbench build and Chromium end-to-end
        image: node:24-bookworm
        script:
          - apt-get update && apt-get install -y --no-install-recommends python3-pip
          - pip3 install --break-system-packages uv==0.12.17
          - uv sync --extra dev --frozen --python 3.12
          - cd web
          - npm ci
          - npm test
          - npx playwright install --with-deps chromium
          - npm run test:e2e
        artifacts:
          - .runtime/browser/**
    - step:
        name: Finite TLA+ safety and negative controls
        script:
          - apt-get update && apt-get install -y --no-install-recommends default-jre-headless curl ca-certificates
          - mkdir -p .runtime/formal-tools
          - curl --fail --location --retry 3 --max-time 120 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output .runtime/formal-tools/tla2tools.jar
          - PYTHONPATH=src python scripts/check_formal.py --jar .runtime/formal-tools/tla2tools.jar
        artifacts:
          - .runtime/formal/*.json
          - .runtime/formal/*.log
